<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Тренажёр 5 класса: Строгий режим</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #f0f4f8; padding: 10px; touch-action: manipulation; }

        .app-container { max-width: 850px; margin: 0 auto; background: white; border-radius: 12px; padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); position: relative; }
        h3 { text-align: center; color: #2c3e50; margin-bottom: 10px; font-size: 1.15rem; }

        .session-settings { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 12px; background: #f8f9fa; padding: 8px; border-radius: 6px; font-size: 0.9rem; font-weight: bold; }
        .session-settings select { padding: 4px 8px; font-size: 0.9rem; font-weight: bold; border-radius: 4px; border: 2px solid #bdc3c7; }

        .score-board { display: flex; justify-content: space-between; align-items: center; background: #34495e; color: white; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-weight: bold; font-size: 0.9rem; }
        .score-board span { color: #2ecc71; }

        .controls { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; margin-bottom: 12px; }
        button { padding: 10px 4px; border: none; border-radius: 6px; background: #3498db; color: white; font-weight: bold; font-size: 0.9rem; cursor: pointer; }
        button:active { transform: scale(0.98); }
        button.op-btn { background: #e67e22; font-size: 1.05rem; }
        button.op-btn.active { background: #d35400; box-shadow: inset 0 0 5px rgba(0,0,0,0.4); }
        button.op-btn.locked { background: #95a5a6; cursor: not-allowed; opacity: 0.75; position: relative; }
        button.op-btn.locked::after {
            content: attr(data-lock-text);
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.55rem;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        .action-container { display: flex; gap: 10px; margin-bottom: 12px; }
        button#check-btn { background: #2ecc71; flex: 2; font-size: 1.1rem; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button#next-btn { background: #34495e; flex: 1; font-size: 1.1rem; padding: 12px; display: none; align-items: center; justify-content: center; gap: 8px; }
        button#toggle-pad-btn { background: #9b59b6; width: 100%; margin-bottom: 12px; font-size: 0.9rem; padding: 8px; }

        .sound-toggle {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #ecf0f1;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            color: #2c3e50;
            transition: background 0.2s;
        }
        .sound-toggle:hover { background: #d5dbdb; }

        .notebook-wrapper { overflow-x: auto; margin-bottom: 12px; border: 2px solid #7f8c8d; border-radius: 4px; background: #fff; }
        .notebook {
            background-color: #fff;
            background-image: linear-gradient(#e0e0e0 1px, transparent 1px), linear-gradient(90deg, #e0e0e0 1px, transparent 1px);
            background-size: 30px 30px;
            padding: 30px 20px;
            min-height: 350px;
            display: inline-block;
            min-width: 100%;
            position: relative;
        }
        .notebook::before { content: ''; position: absolute; top: 0; left: 45px; width: 2px; height: 100%; background: #ff7675; pointer-events: none; }

        .math-matrix { display: flex; flex-direction: column; gap: 0; font-weight: bold; color: #2c3e50; }
        .matrix-row { display: flex; height: 30px; align-items: center; position: relative; }
        .matrix-row.solid-line::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background-color: #2c3e50; }

        .matrix-cell { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-family: monospace; position: relative; text-align: center; }
        .matrix-cell sup { font-size: 14px; color: #e74c3c; margin-left: 1px; margin-top: -10px; }

        .matrix-cell input { width: 100%; height: 100%; border: none; background: transparent; text-align: center; font-size: 20px; font-weight: bold; color: #2980b9; font-family: monospace; padding: 0; transition: background-color 0.2s; border-radius: 0; caret-color: #e67e22; }
        .matrix-cell input:focus { background: #d6eaf8; outline: 2px solid #2980b9; z-index: 2; }

        .matrix-cell input.cell-correct { background-color: #d4edda !important; color: #155724 !important; }
        .matrix-cell input.cell-incorrect { background-color: #f8d7da !important; color: #721c24 !important; }

        .matrix-cell.div-corner-right { border-right: 2px solid #2c3e50; }
        .matrix-cell.div-corner-bottom { border-bottom: 2px solid #2c3e50; }

        /* ===== Геометрия: Тест (выбор названия) ===== */
        .geom-container { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 10px 10px 35px; width: 100%; }
        .geom-prompt { font-size: 1rem; color: #2c3e50; margin-bottom: 10px; text-align: center; }
        .geom-svg-box { background: rgba(255, 255, 255, 0.9); border: 2px solid #bdc3c7; border-radius: 8px; padding: 10px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; }
        .geom-options { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 300px; }
        .geom-opt-btn { width: 100%; padding: 11px 14px; font-size: 1rem; font-weight: bold; background: #f8f9fa; color: #2c3e50; border: 2px solid #bdc3c7; border-radius: 8px; cursor: pointer; transition: all 0.15s; }
        .geom-opt-btn.selected { background: #d6eaf8; border-color: #2980b9; color: #1a5276; box-shadow: 0 0 0 2px rgba(41, 128, 185, 0.25); }
        .geom-opt-btn.cell-correct { background-color: #d4edda !important; color: #155724 !important; border-color: #28a745 !important; }
        .geom-opt-btn.cell-incorrect { background-color: #f8d7da !important; color: #721c24 !important; border-color: #dc3545 !important; }

        /* ===== Геометрия: Черчение ===== */
        .draw-container { display: flex; flex-direction: column; align-items: center; padding: 10px 10px 10px 35px; width: 100%; }
        .draw-prompt { font-size: 1.1rem; color: #2c3e50; margin-bottom: 10px; text-align: center; font-weight: bold; }
        .draw-mode-badge {
            display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem;
            font-weight: bold; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .draw-mode-badge.test { background: #d5f5e3; color: #1e8449; }
        .draw-mode-badge.draw { background: #d6eaf8; color: #1a5276; }
        .draw-canvas-wrap { width: 100%; max-width: 420px; margin-bottom: 10px; }
        .draw-canvas-wrap svg { display: block; width: 100%; height: 260px; border: 2px solid #bdc3c7; border-radius: 8px; background: rgba(255,255,255,0.9); cursor: crosshair; touch-action: none; }
        .draw-controls { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; justify-content: center; }
        .draw-controls button { padding: 8px 14px; font-size: 0.88rem; border-radius: 6px; }
        .draw-hint { font-size: 0.85rem; color: #7f8c8d; text-align: center; max-width: 360px; line-height: 1.4; }
        .draw-etalon { display: none; margin-top: 10px; text-align: center; }
        .draw-etalon.show { display: block; }
        .draw-etalon-label { font-size: 0.85rem; color: #7f8c8d; margin-bottom: 4px; }

        #result-msg { text-align: center; font-weight: bold; font-size: 1.05rem; margin-top: 5px; min-height: 25px; }
        .correct-text { color: #2ecc71; }
        .incorrect-text { color: #e74c3c; }

        .modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(44, 62, 80, 0.96); border-radius: 12px; z-index: 2000; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; padding: 20px; }
        .modal p { font-size: 1.15rem; margin-bottom: 20px; line-height: 1.5; }
        .modal-meta { font-size: 0.9rem; color: #bdc3c7; margin-top: 8px; display: block; }

        .footer-contact { text-align: center; margin-top: 15px; padding-top: 10px; border-top: 1px solid #ecf0f1; font-size: 0.85rem; color: #7f8c8d; }
        .footer-contact a { color: #3498db; text-decoration: none; font-weight: bold; }

        .scratchpad {
            position: fixed;
            top: 70px;
            right: 15px;
            width: 240px;
            height: 270px;
            background: #fefefa;
            border: 2px solid #34495e;
            box-shadow: 0 8px 25px rgba(0,0,0,0.35);
            border-radius: 8px;
            z-index: 1500;
            display: none;
            flex-direction: column;
            overflow: hidden;
            touch-action: none;
        }
        .scratchpad.expanded { width: 320px; height: 380px; }
        .scratchpad-header { background: #34495e; color: white; padding: 6px 8px; font-size: 0.75rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center; cursor: move; touch-action: none; user-select: none; }
        .scratchpad-btns { display: flex; gap: 6px; }
        .scratchpad-btns button { padding: 5px 10px; border-radius: 4px; font-size: 0.8rem; line-height: 1; }
        .btn-expand { background: #3498db; }
        .btn-clear { background: #e74c3c; }
        .scratchpad-canvas { flex: 1; width: 100%; height: 100%; display: block; background: #fffdf0; touch-action: none; cursor: crosshair; }
    </style>
</head>
<body>

<div class="app-container">
    <button class="sound-toggle" id="sound-toggle" onclick="toggleSound()" title="Звук">🔊</button>

    <h3>Математический Контрольный Тренажёр</h3>

    <div class="session-settings">
        <label for="total-tasks-select">Примеров в сессии:</label>
        <select id="total-tasks-select" onchange="restartSession()">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="15">15</option>
            <option value="20">20</option>
        </select>
    </div>

    <div class="score-board">
        <div id="task-counter">Пример: 1 из 10</div>
        <div>Верно: <span id="correct-counter">0</span></div>
    </div>

    <div class="controls">
        <button class="op-btn" id="btn-add" onclick="selectOperation('add')">+</button>
        <button class="op-btn" id="btn-sub" onclick="selectOperation('sub')">-</button>
        <button class="op-btn" id="btn-mul" onclick="selectOperation('mul')">×</button>
        <button class="op-btn" id="btn-div" onclick="selectOperation('div')">÷</button>
        <button class="op-btn" id="btn-pow" onclick="selectOperation('pow')">aⁿ</button>
        <button class="op-btn" id="btn-geom" onclick="selectOperation('geom')">📐</button>

    <div class="notebook-wrapper">

        </div>
    </div>

    <div class="action-container">
        <button id="check-btn" onclick="checkAnswer()">✔️ Проверить пример</button>
        <button id="next-btn" onclick="goToNextTask()">Дальше ➡️</button>
    </div>

    <div id="result-msg"></div>

    <div class="modal" id="finish-modal">

    </div>

    <div class="footer-contact">
        По вопросам и предложениям: <a href="mailto:rajaz63361@gmail.com">rajaz63361@gmail.com</a>
    </div>
</div>

<div class="scratchpad" id="pad">
    <div class="scratchpad-header" id="pad-header">
        <span>ЧЕРНОВИК (тяни)</span>
        <div class="scratchpad-btns">
            <button type="button" class="btn-expand" id="btn-pad-size" title="Изменить размер">⤢</button>
            <button type="button" class="btn-clear" id="btn-pad-clear">Стереть</button>
        </div>
    </div>
    <canvas class="scratchpad-canvas" id="canvas"></canvas>
</div>

<script>
    // ============ Звуковая система ============
    let audioCtx = null;
    let soundEnabled = true;
    let audioInitialized = false;

    function initAudio() {
        if (audioInitialized) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioInitialized = true;
        } catch(e) {
            soundEnabled = false;
        }
    }

    function ensureAudio() {
        if (!soundEnabled) return false;
        if (!audioInitialized) initAudio();
        if (!audioCtx) return false;
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return true;
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        const btn = document.getElementById('sound-toggle');
        btn.textContent = soundEnabled ? '🔊' : '🔇';
        if (soundEnabled) {
            ensureAudio();
            playTick();
        }
    }

    function playTone(freq, type, duration, volume = 0.15, delay = 0) {
        if (!ensureAudio()) return;
        const t = audioCtx.currentTime + delay;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(volume, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + duration);
    }

    function playTick() { if (soundEnabled) playTone(420, 'square', 0.035, 0.08); }
    function playClick() { if (soundEnabled) playTone(950, 'sine', 0.045, 0.12); }
    function playDraw() { if (soundEnabled) playTone(680, 'triangle', 0.065, 0.1); }
    function playClose() {
        if (!soundEnabled) return;
        playTone(523.25, 'sine', 0.12, 0.12, 0.0);
        playTone(659.25, 'sine', 0.14, 0.10, 0.07);
    }
    function playSuccess() {
        if (!soundEnabled) return;
        playTone(523.25, 'sine', 0.10, 0.12, 0.00);
        playTone(659.25, 'sine', 0.10, 0.11, 0.08);
        playTone(783.99, 'sine', 0.10, 0.10, 0.16);
        playTone(1046.50, 'sine', 0.22, 0.10, 0.24);
    }
    function playError() {
        if (!soundEnabled) return;
        playTone(280, 'sawtooth', 0.12, 0.08, 0.00);
        playTone(180, 'sawtooth', 0.22, 0.06, 0.10);
    }
    function playFinish() {
        if (!soundEnabled) return;
        playTone(523.25, 'sine', 0.15, 0.10, 0.00);
        playTone(659.25, 'sine', 0.15, 0.10, 0.12);
        playTone(783.99, 'sine', 0.15, 0.10, 0.24);
        playTone(987.77, 'sine', 0.15, 0.10, 0.36);
        playTone(1046.50, 'sine', 0.35, 0.12, 0.48);
    }
    function playVibrate(pattern) {
        if (navigator.vibrate) navigator.vibrate(pattern);
    }

    // ============ Основное приложение ============

    let powData = null;
    let currentGeomTask = null;

    let lastDrawIndex = -1;

    let drawLines = [];

        { name: 'Прямая',

    /* ============ Блокировка геометрии ============ */
    const GEOM_UNLOCK_KEY = 'geomUnlockCount';
    const GEOM_UNLOCK_NEEDED = 5;

    function getGeomUnlockProgress() {
        return parseInt(sessionStorage.getItem(GEOM_UNLOCK_KEY) || '0', 10);
    }
    function incrementGeomUnlockProgress() {
        const current = getGeomUnlockProgress();
        sessionStorage.setItem(GEOM_UNLOCK_KEY, String(current + 1));
        updateGeomButtonState();
    }
    function isGeomUnlocked() {
        return getGeomUnlockProgress() >= GEOM_UNLOCK_NEEDED;
    }
    function updateGeomButtonState() {
        const btn = document.getElementById('btn-geom');
        const progress = getGeomUnlockProgress();
        if (isGeomUnlocked()) {
            btn.classList.remove('locked');
            btn.removeAttribute('data-lock-text');
            btn.textContent = '📐';
        } else {
            btn.classList.add('locked');
            const remaining = GEOM_UNLOCK_NEEDED - progress;
            btn.setAttribute('data-lock-text', `ещё ${remaining}`);
            btn.textContent = '🔒';
        }
    }

    function getExampleWordForm(n) {
        if (n === 1) return '';
        if (n >= 2 && n <= 4) return 'а';
        return 'ов';
    }

    function toggleScratchpad() {
        const pad = document.getElementById('pad');
        const btn = document.getElementById('toggle-pad-btn');
        if (pad.style.display === 'flex') {
            pad.style.display = 'none';
            btn.textContent = '📝 Показать черновик';
        } else {
            pad.style.display = 'flex';
            btn.textContent = '❌ Скрыть черновик';
            requestAnimationFrame(resizeCanvas);
        }
    }

    function selectOperation(type) {
        if (type === 'geom' && !isGeomUnlocked()) {
            const remaining = GEOM_UNLOCK_NEEDED - getGeomUnlockProgress();
            const msg = document.getElementById('result-msg');
            msg.innerHTML = `🔒 Геометрия заблокирована! Решите ещё ${remaining} пример${getExampleWordForm(remaining)} в других режимах.`;
            msg.className = 'incorrect-text';
            playError();
            playVibrate([60, 40, 60]);
            return;
        }
        playTick();
        document.querySelectorAll('.op-btn').forEach(b => b.classList.remove('active'));
        const activeBtn = document.getElementById('btn-' + type);
        if (activeBtn) activeBtn.classList.add('active');
        currentOperation = type;
        restartSession();
    }

    function createRandomPower() {
        const exp = Math.floor(Math.random() * 7) + 2;
        let maxBase = 10;
        if (exp === 3) maxBase = 9;
        else if (exp === 4) maxBase = 6;
        else if (exp === 5) maxBase = 4;
        else if (exp >= 6) maxBase = 3;
        const base = Math.floor(Math.random() * (maxBase - 2 + 1)) + 2;
        return { base: base, exp: exp, val: Math.pow(base, exp) };
    }

    function generateExample() {
        if (!currentOperation) return;
        maxTasks = parseInt(document.getElementById('total-tasks-select').value);
        document.getElementById('result-msg').innerHTML = '';
        document.getElementById('check-btn').style.display = 'flex';
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('task-counter').textContent = `Пример: ${currentTaskIndex} из ${maxTasks}`;
        document.getElementById('correct-counter').textContent = correctCount;

        if (currentOperation === 'add') {
            num1 = Math.floor(Math.random() * 900000) + 1000;
            num2 = Math.floor(Math.random() * 900000) + 1000;
            currentCorrectAnswer = num1 + num2;
        }
        else if (currentOperation === 'sub') {
            num1 = Math.floor(Math.random() * 900000) + 10000;
            num2 = Math.floor(Math.random() * (num1 - 1000)) + 500;
            currentCorrectAnswer = num1 - num2;
        }
        else if (currentOperation === 'mul') {
            num1 = Math.floor(Math.random() * 2500) + 120;
            num2 = Math.floor(Math.random() * 450) + 12;
            currentCorrectAnswer = num1 * num2;
        }
        else if (currentOperation === 'div') {
            num2 = Math.floor(Math.random() * 350) + 12;
            currentCorrectAnswer = Math.floor(Math.random() * 4500) + 105;
            num1 = num2 * currentCorrectAnswer;
        }
        else if (currentOperation === 'pow') {
            const isSum = Math.random() < 0.5;
            const p1 = createRandomPower();
            if (isSum) {
                const p2 = createRandomPower();
                powData = { isSum: true, p1: p1, p2: p2 };
                currentCorrectAnswer = p1.val + p2.val;
            } else {
                powData = { isSum: false, p1: p1 };
                currentCorrectAnswer = p1.val;
            }
        }
        else if (currentOperation === 'geom') {
            currentGeomMode = Math.random() < 0.5 ? 'test' : 'draw';
            if (currentGeomMode === 'test') {
                let idx;
                do { idx = Math.floor(Math.random() * geometryTasks.length); }
                while (idx === lastGeomIndex && geometryTasks.length > 1);
                lastGeomIndex = idx;
                currentGeomTask = geometryTasks[idx];
            } else {
                let idx;
                do { idx = Math.floor(Math.random() * drawTasks.length); }
                while (idx === lastDrawIndex && drawTasks.length > 1);
                lastDrawIndex = idx;
                currentDrawTask = drawTasks[idx];
            }
        }
        buildInteractiveGrid();
    }

    function focusFirstInput(targetInput) {
        if (!targetInput || typeof targetInput.focus !== 'function') return;
        setTimeout(() => {
            targetInput.focus();
            if (typeof targetInput.select === 'function') targetInput.select();
        }, 60);
    }

    function buildInteractiveGrid() {
        const container = document.getElementById('math-matrix-container');
        container.innerHTML = '';
        solutionMatrix = [];
        inputFlow = [];

        if (currentOperation === 'geom') {
            if (currentGeomMode === 'draw') {
                buildDrawGrid(container);
                return;
            }
            selectedGeomAnswer = '';
            const box = document.createElement('div');
            box.className = 'geom-container';
            const badge = document.createElement('div');
            badge.className = 'draw-mode-badge test';
            badge.textContent = 'Тест';
            box.appendChild(badge);
            const prompt = document.createElement('div');
            prompt.className = 'geom-prompt';
            prompt.textContent = 'Выбери правильное название фигуры:';
            box.appendChild(prompt);
            const svgBox = document.createElement('div');
            svgBox.className = 'geom-svg-box';
            svgBox.innerHTML = currentGeomTask.svg;
            box.appendChild(svgBox);

            const otherNames = geometryTasks
                .filter(t => t.name !== currentGeomTask.name)
                .map(t => t.name)
                .sort(() => Math.random() - 0.5)
                .slice(0, 2);
            const choices = [currentGeomTask.name, ...otherNames].sort(() => Math.random() - 0.5);
            const optsWrap = document.createElement('div');
            optsWrap.className = 'geom-options';
            choices.forEach(choiceName => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'geom-opt-btn';
                btn.textContent = choiceName;
                btn.addEventListener('click', function() {
                    if (btn.disabled) return;
                    optsWrap.querySelectorAll('.geom-opt-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    selectedGeomAnswer = choiceName;
                    playClick();
                });
                optsWrap.appendChild(btn);
            });
            box.appendChild(optsWrap);
            container.appendChild(box);
            return;
        }

        let ansStr = currentCorrectAnswer.toString();

        if (currentOperation === 'pow') {
            let tokens = [];
            let b1 = powData.p1.base.toString();
            for (let ch of b1) tokens.push({ text: ch, sup: '' });
            tokens.at(-1).sup = powData.p1.exp.toString();
            if (powData.isSum) {
                tokens.push({ text: '+', sup: '' });
                let b2 = powData.p2.base.toString();
                for (let ch of b2) tokens.push({ text: ch, sup: '' });
                tokens.at(-1).sup = powData.p2.exp.toString();
            }
            tokens.push({ text: '=', sup: '' });
            let totalCols = Math.max(tokens.length + ansStr.length + 3, 14);

            let topPadRow = createRowElement();
            for (let i = 0; i < totalCols; i++) topPadRow.appendChild(createCell(''));
            container.appendChild(topPadRow);

            let mainRow = createRowElement();
            let colIdx = 2;
            for (let t of tokens) {
                let cell = createCell(t.text);
                if (t.sup) {
                    let supEl = document.createElement('sup');
                    supEl.textContent = t.sup;
                    cell.appendChild(supEl);
                }
                mainRow.appendChild(cell);
                colIdx++;
            }
            let ansInputs = [];
            for (let i = 0; i < ansStr.length; i++) {
                let cell = createCell('', true, ansStr.charAt(i));
                cell.style.borderBottom = "2px solid #2c3e50";
                mainRow.appendChild(cell);
                let inp = cell.querySelector('input');
                solutionMatrix.push(inp);
                ansInputs.push(inp);
                colIdx++;
            }
            inputFlow.push(...ansInputs);
            while (colIdx < totalCols) {
                mainRow.appendChild(createCell(''));
                colIdx++;
            }
            container.appendChild(mainRow);

            let botPadRow = createRowElement();
            for (let i = 0; i < totalCols; i++) botPadRow.appendChild(createCell(''));
            container.appendChild(botPadRow);

            for (let r = 0; r < 5; r++) {
                let scratchRow = createRowElement();
                let rowInputs = [];
                for (let c = 0; c < totalCols; c++) {
                    if (c >= 2 && c < totalCols - 1) {
                        let cell = createCell('', true, ' ');
                        scratchRow.appendChild(cell);
                        rowInputs.push(cell.querySelector('input'));
                    } else {
                        scratchRow.appendChild(createCell(''));
                    }
                }
                inputFlow.push(...rowInputs);
                container.appendChild(scratchRow);
            }
            bindFlowNavigation();
            focusFirstInput(ansInputs.at(0));
            return;
        }
        let s1 = num1.toString();
        let s2 = num2.toString();
        let sign = currentOperation === 'add' ? '+' : currentOperation === 'sub' ? '-' : currentOperation === 'mul' ? '×' : '÷';

        if (currentOperation !== 'div') {
            let len = Math.max(s1.length, s2.length, ansStr.length);
            let totalCols = len + 4;

            let row1 = createRowElement();
            let startCol1 = totalCols - s1.length;
            for (let i = 0; i < totalCols; i++) {
                row1.appendChild(createCell((i >= startCol1) ? s1.charAt(i - startCol1) : ''));
            }
            container.appendChild(row1);

            let row2 = createRowElement();
            let startCol2 = totalCols - s2.length;
            for (let i = 0; i < totalCols; i++) {
                let char = '';
                if (i === startCol2 - 2) char = sign;
                else if (i >= startCol2) char = s2.charAt(i - startCol2);
                row2.appendChild(createCell(char));
            }
            row2.classList.add('solid-line');
            container.appendChild(row2);

            if (currentOperation === 'mul' && s2.length > 1) {
                for (let r = 0; r < s2.length; r++) {
                    let tempRow = createRowElement();
                    let rowCells = [];
                    for (let i = 0; i < totalCols; i++) {
                        let cell = createCell('', true, ' ');
                        tempRow.appendChild(cell);
                        rowCells.push(cell.querySelector('input'));
                    }
                    if (r === s2.length - 1) tempRow.classList.add('solid-line');
                    container.appendChild(tempRow);
                    let activePart = rowCells.slice(1, totalCols - r).reverse();
                    inputFlow.push(...activePart);
                }
            }

            let rowAns = createRowElement();
            let startAnsCol = totalCols - ansStr.length;
            let ansInputs = [];
            for (let i = 0; i < totalCols; i++) {
                if (i >= startAnsCol) {
                    let expectedChar = ansStr.charAt(i - startAnsCol);
                    let cell = createCell('', true, expectedChar);
                    rowAns.appendChild(cell);
                    let inp = cell.querySelector('input');
                    solutionMatrix.push(inp);
                    ansInputs.push(inp);
                } else {
                    rowAns.appendChild(createCell(''));
                }
            }
            container.appendChild(rowAns);
            inputFlow.push(...ansInputs.slice().reverse());
            bindFlowNavigation();
            focusFirstInput(inputFlow.at(0));
        } else {
            let totalCols = Math.max(s1.length + s2.length + 4, 16);

            let row1 = createRowElement();
            for (let i = 0; i < totalCols; i++) {
                let cell;
                if (i < s1.length) cell = createCell(s1.charAt(i));
                else if (i === s1.length) { cell = createCell(''); cell.classList.add('div-corner-right'); }
                else if (i > s1.length && i <= s1.length + s2.length) cell = createCell(s2.charAt(i - s1.length - 1));
                else cell = createCell('');
                row1.appendChild(cell);
            }
            container.appendChild(row1);

            let row2 = createRowElement();
            let startAnsCol = s1.length + 1;
            let leftRow2Inputs = [];
            let quotientInputs = [];
            for (let i = 0; i < totalCols; i++) {
                let cell;
                if (i < s1.length) {
                    cell = createCell('', true, ' ');
                    leftRow2Inputs.push(cell.querySelector('input'));
                } else if (i === s1.length) {
                    cell = createCell(''); cell.classList.add('div-corner-right');
                } else if (i >= startAnsCol && i < startAnsCol + ansStr.length) {
                    let expectedChar = ansStr.charAt(i - startAnsCol);
                    cell = createCell('', true, expectedChar);
                    cell.classList.add('div-corner-bottom');
                    let inp = cell.querySelector('input');
                    solutionMatrix.push(inp);
                    quotientInputs.push(inp);
                } else {
                    cell = createCell('');
                    if (i >= startAnsCol) cell.classList.add('div-corner-bottom');
                }
                row2.appendChild(cell);
            }
            container.appendChild(row2);
            inputFlow.push(...quotientInputs);
            inputFlow.push(...leftRow2Inputs);

            for (let r = 0; r < 8; r++) {
                let row = createRowElement();
                let calcInputs = [];
                for (let c = 0; c < totalCols; c++) {
                    let cell;
                    if (c <= s1.length + 2) {
                        cell = createCell('', true, ' ');
                        calcInputs.push(cell.querySelector('input'));
                        if (r % 2 === 1 && c < s1.length + 1) {
                            cell.style.borderBottom = "2px solid #2c3e50";
                        }
                    } else {
                        cell = createCell('');
                    }
                    row.appendChild(cell);
                }
                inputFlow.push(...calcInputs);
                container.appendChild(row);
            }
            bindFlowNavigation();
            focusFirstInput(quotientInputs.at(0));
        }
    }

    function buildDrawGrid(container) {
        const box = document.createElement('div');
        box.className = 'draw-container';
        const badge = document.createElement('div');
        badge.className = 'draw-mode-badge draw';
        badge.textContent = 'Черчение';
        box.appendChild(badge);
        const prompt = document.createElement('div');
        prompt.className = 'draw-prompt';
        prompt.innerHTML = `Нарисуй: <b>${currentDrawTask.name}</b>`;
        box.appendChild(prompt);

        const wrap = document.createElement('div');
        wrap.className = 'draw-canvas-wrap';
        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('id', 'draw-svg');
        svg.setAttribute('viewBox', '0 0 400 260');

        const defs = document.createElementNS(svgNS, 'defs');
        const pattern = document.createElementNS(svgNS, 'pattern');
        pattern.setAttribute('id', 'draw-grid');
        pattern.setAttribute('width', '20');
        pattern.setAttribute('height', '20');
        pattern.setAttribute('patternUnits', 'userSpaceOnUse');
        const gridPath = document.createElementNS(svgNS, 'path');
        gridPath.setAttribute('d', 'M 20 0 L 0 0 0 20');
        gridPath.setAttribute('fill', 'none');
        gridPath.setAttribute('stroke', '#e0e0e0');
        gridPath.setAttribute('stroke-width', '0.5');
        pattern.appendChild(gridPath);
        defs.appendChild(pattern);
        svg.appendChild(defs);

        const bg = document.createElementNS(svgNS, 'rect');
        bg.setAttribute('width', '100%');
        bg.setAttribute('height', '100%');
        bg.setAttribute('fill', 'url(#draw-grid)');
        svg.appendChild(bg);
        wrap.appendChild(svg);
        box.appendChild(wrap);

        const controls = document.createElement('div');
        controls.className = 'draw-controls';
        controls.innerHTML = `
            <button type="button" onclick="undoLastLine(); playTick();" style="background:#f39c12;">↩️ Отменить</button>
            <button type="button" onclick="closeShape(); playTick();" style="background:#3498db;">🔗 Замкнуть</button>
            <button type="button" onclick="clearDrawing(); playTick();" style="background:#e74c3c;">🗑️ Очистить</button>
        `;
        box.appendChild(controls);

        const hint = document.createElement('div');
        hint.className = 'draw-hint';
        hint.textContent = currentDrawTask.hint;
        box.appendChild(hint);

        const etalon = document.createElement('div');
        etalon.className = 'draw-etalon';
        etalon.id = 'draw-etalon';
        etalon.innerHTML = `
            <div class="draw-etalon-label">Эталон — ${currentDrawTask.name}</div>
            <div class="geom-svg-box" id="draw-etalon-svg"></div>
        `;
        box.appendChild(etalon);
        container.appendChild(box);

        drawPoints = [];
        drawLines = [];
        isDrawingClosed = false;
        svg.addEventListener('click', handleDrawClick);
    }

    function handleDrawClick(e) {
        const svg = document.getElementById('draw-svg');
        if (!svg || svg.style.pointerEvents === 'none') return;
        const rect = svg.getBoundingClientRect();
        const viewBox = svg.viewBox.baseVal;
        const scaleX = viewBox.width / rect.width;
        const scaleY = viewBox.height / rect.height;
        const x = (e.clientX - rect.left) * scaleX;
        const y = (e.clientY - rect.top) * scaleY;
        addDrawPoint(x, y);
    }

    function addDrawPoint(x, y) {
        const svg = document.getElementById('draw-svg');
        const svgNS = 'http://www.w3.org/2000/svg';
        const circle = document.createElementNS(svgNS, 'circle');
        circle.setAttribute('cx', x);
        circle.setAttribute('cy', y);
        circle.setAttribute('r', 4);
        circle.setAttribute('fill', '#e74c3c');
        circle.setAttribute('class', 'draw-point');
        svg.appendChild(circle);
        drawPoints.push({ x, y });
        playClick();

        if (drawPoints.length >= 2) {
            const prev = drawPoints[drawPoints.length - 2];
            const line = document.createElementNS(svgNS, 'line');
            line.setAttribute('x1', prev.x);
            line.setAttribute('y1', prev.y);
            line.setAttribute('x2', x);
            line.setAttribute('y2', y);
            line.setAttribute('stroke', '#2c3e50');
            line.setAttribute('stroke-width', '2.5');
            line.setAttribute('stroke-linecap', 'round');
            line.setAttribute('class', 'draw-line');
            svg.appendChild(line);
            drawLines.push({ x1: prev.x, y1: prev.y, x2: x, y2: y });
            playDraw();
        }
    }

    function undoLastLine() {
        const svg = document.getElementById('draw-svg');
        if (!svg) return;
        if (isDrawingClosed) {
            const lines = svg.querySelectorAll('.draw-line');
            if (lines.length > 0) {
                lines[lines.length - 1].remove();
                drawLines.pop();
            }
            isDrawingClosed = false;
            return;
        }
        if (drawPoints.length === 0) return;
        const points = svg.querySelectorAll('.draw-point');
        if (points.length > 0) points[points.length - 1].remove();
        drawPoints.pop();
        const lines = svg.querySelectorAll('.draw-line');
        if (lines.length > 0) {
            lines[lines.length - 1].remove();
            drawLines.pop();
        }
    }

    function closeShape() {
        if (drawPoints.length < 3 || isDrawingClosed) return;
        const first = drawPoints[0];
        const last = drawPoints[drawPoints.length - 1];
        const svg = document.getElementById('draw-svg');
        const svgNS = 'http://www.w3.org/2000/svg';
        const line = document.createElementNS(svgNS, 'line');
        line.setAttribute('x1', last.x);
        line.setAttribute('y1', last.y);
        line.setAttribute('x2', first.x);
        line.setAttribute('y2', first.y);
        line.setAttribute('stroke', '#2c3e50');
        line.setAttribute('stroke-width', '2.5');
        line.setAttribute('stroke-linecap', 'round');
        line.setAttribute('class', 'draw-line');
        svg.appendChild(line);
        drawLines.push({ x1: last.x, y1: last.y, x2: first.x, y2: first.y });
        isDrawingClosed = true;
        playClose();
        playVibrate([30, 20, 30]);
    }

    function clearDrawing() {
        const svg = document.getElementById('draw-svg');
        if (!svg) return;
        svg.querySelectorAll('.draw-point, .draw-line').forEach(el => el.remove());
        drawPoints = [];
        drawLines = [];
        isDrawingClosed = false;
    }

    function getLineLength(l) {
        return Math.sqrt((l.x2 - l.x1) ** 2 + (l.y2 - l.y1) ** 2);
    }
    function calcAngleAtPoint(vertexIdx) {
        if (drawPoints.length < 3) return 0;
        const p = drawPoints[vertexIdx];
        const neighbors = [];
        drawLines.forEach(ln => {
            const dx1 = Math.abs(ln.x1 - p.x);
            const dy1 = Math.abs(ln.y1 - p.y);
            const dx2 = Math.abs(ln.x2 - p.x);
            const dy2 = Math.abs(ln.y2 - p.y);
            if (dx1 < 1 && dy1 < 1) neighbors.push({ x: ln.x2, y: ln.y2 });
            else if (dx2 < 1 && dy2 < 1) neighbors.push({ x: ln.x1, y: ln.y1 });
        });
        if (neighbors.length < 2) return 0;
        const n0 = neighbors[0];
        const n1 = neighbors[1];
        const dx1 = n0.x - p.x, dy1 = n0.y - p.y;
        const dx2 = n1.x - p.x, dy2 = n1.y - p.y;
        const dot = dx1 * dx2 + dy1 * dy2;
        const len1 = Math.sqrt(dx1 * dx1 + dy1 * dy1);
        const len2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
        if (len1 === 0 || len2 === 0) return 0;
        const cos = Math.abs(dot / (len1 * len2));
        const clamped = Math.min(1, Math.max(0, cos));
        return Math.acos(clamped) * 180 / Math.PI;
    }
    function checkEqualSides(toleranceRatio) {
        if (drawLines.length < 2) return false;
        const lengths = drawLines.map(getLineLength);
        const avg = lengths.reduce((a, b) => a + b, 0) / lengths.length;
        return lengths.every(l => Math.abs(l - avg) <= avg * toleranceRatio);
    }
    function checkRightAngles() {
        if (drawPoints.length < 3) return false;
        for (let i = 0; i < drawPoints.length; i++) {
            const angle = calcAngleAtPoint(i);
            if (angle < 60 || angle > 120) return false;
        }
        return true;
    }
    function checkDrawAnswer() {
        const task = currentDrawTask;
        let passed = true;
        let feedback = '';
        if (drawLines.length < task.minLines) {
            passed = false;
            feedback = `Мало линий. Нужно минимум ${task.minLines}.`;
        } else if (drawLines.length > task.maxLines) {
            passed = false;
            feedback = `Слишком много линий. Достаточно ${task.maxLines}.`;
        } else if (task.needsClose && !isDrawingClosed) {
            passed = false;
            feedback = 'Фигура не замкнута. Нажми «Замкнуть».';
        } else if (task.name === 'прямой угол') {
            if (drawPoints.length !== 3) {
                passed = false;
                feedback = 'Для прямого угла нужно ровно 3 точки.';
            } else {
                const angle = calcAngleAtPoint(1);
                if (angle < 70 || angle > 110) {
                    passed = false;
                    feedback = 'Угол не похож на прямой. Попробуй нарисовать более прямой угол.';
                }
            }
        } else if (task.name === 'квадрат') {
            if (!checkEqualSides(0.45) || !checkRightAngles()) {
                passed = false;
                feedback = 'Фигура похожа не на квадрат. Проверь, чтобы стороны были примерно равны, а углы — прямые.';
            }
        } else if (task.name === 'прямоугольник') {
            if (!checkRightAngles()) {
                passed = false;
                feedback = 'Углы не похожи на прямые. В прямоугольнике все углы прямые.';
            }
        } else if (task.name === 'ромб') {
            if (!checkEqualSides(0.45)) {
                passed = false;
                feedback = 'Стороны не равны. В ромбе все стороны должны быть примерно одинаковыми.';
            }
        }
        return { passed, feedback };
    }

    function createRowElement() {
        let row = document.createElement('div');
        row.className = 'matrix-row';
        return row;
    }
    function createCell(char = '', isInput = false, expected = '') {
        let cell = document.createElement('div');
        cell.className = 'matrix-cell';
        if (isInput) {
            let input = document.createElement('input');
            input.type = 'text';
            input.inputMode = 'numeric';
            input.pattern = '[0-9]*';
            input.maxLength = 1;
            input.autocomplete = 'off';
            if (expected !== ' ') {
                input.dataset.expected = expected;
            }
            cell.appendChild(input);
        } else {
            cell.textContent = char;
        }
        return cell;
    }

    function bindFlowNavigation() {
        inputFlow.forEach((inp, idx) => {
            inp.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, '');
                this.className = '';
                const nextInp = inputFlow.at(idx + 1);
                if (this.value.length === 1 && nextInp) {
                    nextInp.focus();
                    playTick();
                }
            });
            inp.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace') {
                    if (this.value === '' && idx - 1 >= 0) {
                        e.preventDefault();
                        const prevInp = inputFlow.at(idx - 1);
                        if (prevInp) {
                            prevInp.focus();
                            prevInp.value = '';
                            playTick();
                        }
                    }
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    const allAnsFilled = solutionMatrix.every(el => el.value.trim() !== '');
                    if (allAnsFilled) {
                        checkAnswer();
                    } else if (solutionMatrix.length > 0) {
                        const firstEmptyAns = solutionMatrix.slice().reverse().find(el => el.value.trim() === '');
                        if (firstEmptyAns) firstEmptyAns.focus();
                    }
                } else if (e.key === 'ArrowLeft') {
                    let prevCell = this.parentElement.previousElementSibling;
                    if (prevCell && prevCell.querySelector('input')) prevCell.querySelector('input').focus();
                } else if (e.key === 'ArrowRight') {
                    let nextCell = this.parentElement.nextElementSibling;
                    if (nextCell && nextCell.querySelector('input')) nextCell.querySelector('input').focus();
                }
            });
            inp.addEventListener('focus', function() {
                this.select();
            });
        });
    }

    function checkAnswer() {
        const msg = document.getElementById('result-msg');

        if (currentOperation === 'geom') {
            if (currentGeomMode === 'draw') {
                const result = checkDrawAnswer();
                const etalonBox = document.getElementById('draw-etalon');
                if (etalonBox) {
                    const etalonSvg = document.getElementById('draw-etalon-svg');
                    const match = geometryTasks.find(t => t.name.toLowerCase() === currentDrawTask.name.toLowerCase());
                    if (match && etalonSvg) {
                        etalonSvg.innerHTML = match.svg;
                    } else if (etalonSvg) {
                        etalonSvg.innerHTML = `<div style="padding:20px;font-weight:bold;color:#2c3e50;">${currentDrawTask.name}</div>`;
                    }
                    etalonBox.classList.add('show');
                }
                const svg = document.getElementById('draw-svg');
                if (svg) svg.style.pointerEvents = 'none';

                if (result.passed) {
                    correctCount++;
                    incrementGeomUnlockProgress();
                    msg.innerHTML = `Отлично! ${currentDrawTask.name} нарисован правильно. 🌟`;
                    msg.className = "correct-text";
                    playSuccess();
                    playVibrate([40, 30, 50]);
                } else {
                    msg.innerHTML = `Почти! ${result.feedback}`;
                    msg.className = "incorrect-text";
                    playError();
                    playVibrate([80, 40, 80]);
                }
                document.getElementById('check-btn').style.display = 'none';
                document.getElementById('next-btn').style.display = 'flex';
                document.getElementById('correct-counter').textContent = correctCount;
                return;
            }

            if (!selectedGeomAnswer) {
                msg.innerHTML = "Сначала нажми на один из трёх вариантов!";
                msg.className = "incorrect-text";
                playError();
                playVibrate([60]);
                return;
            }
            const buttons = document.querySelectorAll('.geom-opt-btn');
            buttons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === currentGeomTask.name) {
                    btn.classList.add('cell-correct');
                } else if (btn.textContent === selectedGeomAnswer && selectedGeomAnswer !== currentGeomTask.name) {
                    btn.classList.add('cell-incorrect');
                }
            });
            if (selectedGeomAnswer === currentGeomTask.name) {
                correctCount++;
                msg.innerHTML = `Верно! Это ${currentGeomTask.name.toLowerCase()}. 🌟`;
                msg.className = "correct-text";
                playSuccess();
                playVibrate([40, 30, 50]);
            } else {
                msg.innerHTML = `Ошибка! Правильный ответ: ${currentGeomTask.name}.`;
                msg.className = "incorrect-text";
                playError();
                playVibrate([80, 40, 80]);
            }
            document.getElementById('check-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'flex';
            document.getElementById('correct-counter').textContent = correctCount;
            return;
        }

        let allCorrect = true;
        let hasEmptyFields = false;
        solutionMatrix.forEach(input => {
            if (input.value.trim() === "") {
                hasEmptyFields = true;
            }
        });
        if (hasEmptyFields) {
            msg.innerHTML = "Сначала заполни все клетки ответа!";
            msg.className = "incorrect-text";
            playError();
            playVibrate([60]);
            const emptyCell = solutionMatrix.slice().reverse().find(el => el.value.trim() === "");
            if (emptyCell) emptyCell.focus();
            return;
        }
        document.querySelectorAll('.matrix-cell input').forEach(inp => inp.disabled = true);
        solutionMatrix.forEach(input => {
            let userVal = input.value.trim();
            let correctVal = input.dataset.expected;
            if (userVal === correctVal) {
                input.className = 'cell-correct';
            } else {
                input.className = 'cell-incorrect';
                allCorrect = false;
            }
        });
        if (allCorrect) {
            correctCount++;
            incrementGeomUnlockProgress();
            msg.innerHTML = "Абсолютно верно! Присвоено 1 очко. 🌟";
            msg.className = "correct-text";
            playSuccess();
            playVibrate([40, 30, 50]);
        } else {
            msg.innerHTML = `Ошибка! Правильный ответ: ${currentCorrectAnswer}.`;
            msg.className = "incorrect-text";
            playError();
            playVibrate([80, 40, 80]);
        }
        document.getElementById('check-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'flex';
        document.getElementById('correct-counter').textContent = correctCount;
    }

    function showFinalModal() {
        const now = new Date();
        const dateStr = now.toLocaleDateString('ru-RU') + ' ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        const topicTitle = operationNames[currentOperation] || 'Математика';
        document.getElementById('final-score').innerHTML = `Тема: <b>${topicTitle}</b><br>Ваш итоговый результат:<br><b style="font-size: 2rem; color: #2ecc71;">${correctCount}</b> из ${maxTasks} правильных<span class="modal-meta">Выполнено: ${dateStr}</span>`;
        document.getElementById('finish-modal').style.display = 'flex';
        playFinish();
        playVibrate([50, 30, 50, 30, 80]);
    }

    function goToNextTask() {
        playTick();
        if (currentTaskIndex < maxTasks) {
            currentTaskIndex++;
            generateExample();
        } else {
            showFinalModal();
        }
    }

    function restartSession() {
        currentTaskIndex = 1;
        correctCount = 0;
        document.getElementById('finish-modal').style.display = 'none';
        generateExample();
    }

    /* ============ Черновик ============ */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const pad = document.getElementById('pad');
    const padHeader = document.getElementById('pad-header');
    const btnPadSize = document.getElementById('btn-pad-size');
    const btnPadClear = document.getElementById('btn-pad-clear');
    let activeDrawPointer = null;

    function resizeCanvas() {
        if (pad.style.display !== 'flex') return;
        const w = pad.clientWidth;
        const h = pad.clientHeight - padHeader.offsetHeight;
        if (w <= 0 || h <= 0) return;
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        const tempCtx = tempCanvas.getContext('2d');
        if (canvas.width > 0 && canvas.height > 0) {
            tempCtx.drawImage(canvas, 0, 0);
        }
        canvas.width = w;
        canvas.height = h;
        ctx.strokeStyle = '#0052cc';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        if (tempCanvas.width > 0 && tempCanvas.height > 0) {
            ctx.drawImage(tempCanvas, 0, 0);
        }
    }

    btnPadSize.addEventListener('click', function(e) {
        e.stopPropagation();
        pad.classList.toggle('expanded');
        requestAnimationFrame(resizeCanvas);
    });
    btnPadClear.addEventListener('click', function(e) {
        e.stopPropagation();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    });
    canvas.addEventListener('pointerdown', function(e) {
        if (activeDrawPointer !== null) return;
        activeDrawPointer = e.pointerId;
        canvas.setPointerCapture(e.pointerId);
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + 0.1, y + 0.1);
        ctx.stroke();
    });
    canvas.addEventListener('pointermove', function(e) {
        if (e.pointerId !== activeDrawPointer) return;
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        ctx.lineTo(x, y);
        ctx.stroke();
    });
    function endDrawPointer(e) {
        if (e.pointerId === activeDrawPointer) {
            activeDrawPointer = null;
        }
    }
    canvas.addEventListener('pointerup', endDrawPointer);
    canvas.addEventListener('pointercancel', endDrawPointer);

    let activeDragPointer = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    padHeader.addEventListener('pointerdown', function(e) {
        if (e.target.tagName === 'BUTTON') return;
        activeDragPointer = e.pointerId;
        padHeader.setPointerCapture(e.pointerId);
        const rect = pad.getBoundingClientRect();
        dragOffsetX = e.clientX - rect.left;
        dragOffsetY = e.clientY - rect.top;
        pad.style.bottom = 'auto';
        pad.style.right = 'auto';
        pad.style.left = rect.left + 'px';
        pad.style.top = rect.top + 'px';
    });
    padHeader.addEventListener('pointermove', function(e) {
        if (e.pointerId !== activeDragPointer) return;
        const newLeft = Math.max(0, Math.min(window.innerWidth - pad.offsetWidth, e.clientX - dragOffsetX));
        const newTop = Math.max(0, Math.min(window.innerHeight - pad.offsetHeight, e.clientY - dragOffsetY));
        pad.style.left = newLeft + 'px';
        pad.style.top = newTop + 'px';
    });
    function endDragPointer(e) {
        if (e.pointerId === activeDragPointer) {
            activeDragPointer = null;
        }
    }
    padHeader.addEventListener('pointerup', endDragPointer);
    padHeader.addEventListener('pointercancel', endDragPointer);

    updateGeomButtonState();
    selectOperation('add');
</script>
